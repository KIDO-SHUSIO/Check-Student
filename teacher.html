<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5faff">
  <title>Teacher Display | ระบบเช็คชื่อ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --primary: #347daf; --primary-dark: #28658f; --ink: #263746; --muted: #7d8c99; --line: #dfebf4; --page: #f5faff; --blue-soft: #edf7ff; --green: #148064; --red: #b52e2b; --amber: #bf7100; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 20px; background: var(--page); color: var(--ink); font-family: 'Sarabun', sans-serif; font-size: 14px; }
    button, input, select { font: inherit; }
    .page { width: min(100%, 1020px); margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .eyebrow { color: var(--primary); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
    h1 { margin: 2px 0 3px; font-size: 25px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 12px; }
    .actions, .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .button { min-height: 34px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #526b7d; font-size: 11px; text-decoration: none; cursor: pointer; }
    .button:hover { border-color: #9dc9e7; color: var(--primary-dark); }
    .button-primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .button-primary:hover { background: var(--primary-dark); color: #fff; }
    .notice { margin-bottom: 13px; padding: 10px 13px; border: 1px solid #d5e9f7; border-radius: 11px; background: var(--blue-soft); color: #52748c; font-size: 11px; line-height: 1.65; }
    .card { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .filters { margin-bottom: 12px; }
    .filter { display: grid; gap: 3px; color: var(--muted); font-size: 10px; }
    input, select { min-height: 35px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 12px; }
    input:focus, select:focus { outline: 2px solid rgba(52,125,175,.15); border-color: #83b9de; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .stat { padding: 9px; border: 1px solid var(--line); border-radius: 11px; background: #f8fbfe; }
    .stat strong { display: block; color: var(--primary); font-size: 21px; line-height: 1.15; }
    .stat span { color: var(--muted); font-size: 10px; }
    .stat.present strong { color: var(--green); }
    .stat.leave strong { color: var(--amber); }
    .stat.absent strong { color: var(--red); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 9px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 600; white-space: nowrap; }
    td { padding: 9px 10px; border-bottom: 1px solid #edf3f8; font-size: 11px; white-space: nowrap; }
    .status-picker { display: flex; flex-wrap: wrap; gap: 5px; min-width: 250px; }
    .status-option { min-height: 30px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #526b7d; font-size: 10px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .status-option:hover:not(:disabled) { border-color: #9dc9e7; color: var(--primary-dark); }
    .status-option:focus-visible { outline: 2px solid rgba(52,125,175,.25); outline-offset: 1px; }
    .status-option:disabled { cursor: wait; opacity: .65; }
    .status-option[aria-pressed="true"][data-status="มา"] { border-color: #a7ddce; background: #e9f8f3; color: var(--green); font-weight: 700; }
    .status-option[aria-pressed="true"][data-status="สาย"] { border-color: #f0d39a; background: #fff7e8; color: var(--amber); font-weight: 700; }
    .status-option[aria-pressed="true"][data-status="ลา"] { border-color: #f0d39a; background: #fff7e8; color: var(--amber); font-weight: 700; }
    .status-option[aria-pressed="true"][data-status="ขาด"] { border-color: #efb9b6; background: #fff0ef; color: var(--red); font-weight: 700; }
    .status-label { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .demo { color: var(--muted); font-size: 10px; }
    .save-note { margin: 10px 0 0; color: var(--muted); font-size: 10px; }
    @media (max-width: 620px) { body { padding: 17px 12px; } .header { flex-direction: column; } .summary { grid-template-columns: repeat(2, 1fr); } .filters { align-items: stretch; } .filter { flex: 1 1 130px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="eyebrow">PT/ TEACHER DISPLAY</div>
        <h1>เช็คชื่อประจำห้อง</h1>
        <p class="subtitle">ตรวจสอบและปรับสถานะการเข้าเรียนของนักเรียน</p>
      </div>
      <nav class="actions" aria-label="จัดการบัญชี">
        <button class="button" id="logoutButton" type="button">ออกจากระบบ</button>
      </nav>
    </header>

    <div class="notice" id="notice" role="status" aria-live="polite">
      กำลังโหลดรายชื่อนักเรียนจากห้องที่ผูกกับเลขประจำตัวครู…
    </div>

    <section class="card" aria-label="รายชื่อและสถานะนักเรียน">
      <div class="filters">
        <label class="filter">วันที่
          <input id="attendanceDate" type="date">
        </label>
        <div class="filter">ชั้น / ห้อง
          <strong id="teacherRoom">กำลังโหลด…</strong>
        </div>
        <span class="demo" id="teacherName"></span>
      </div>
      <div class="summary" aria-label="สรุปสถานะ">
        <div class="stat"><strong id="studentCount">0</strong><span>นักเรียน</span></div>
        <div class="stat present"><strong id="presentCount">0</strong><span>มา / สาย</span></div>
        <div class="stat leave"><strong id="leaveCount">0</strong><span>ลา</span></div>
        <div class="stat absent"><strong id="absentCount">0</strong><span>ขาด</span></div>
        <div class="stat"><strong id="uncheckedCount">0</strong><span>ยังไม่เช็คชื่อ</span></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>เลขที่</th><th>รหัสนักเรียน</th><th>ชื่อ - นามสกุล</th><th>สถานะ</th></tr></thead>
          <tbody id="studentRows"></tbody>
        </table>
      </div>
      <p class="save-note" id="saveNote" role="status" aria-live="polite">สถานะจะบันทึกลงชีต Attendance เมื่อเลือก</p>
    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlHFOZ71s3oCZNHi1ei704q4G8AtQY9u3bLLdbkqoSWWjFhqmvMlSMuroCE3rveQfGbg/exec";
    const AUTH_TOKEN_KEY = "attendanceSessionToken";
    const AUTH_ROLE_KEY = "attendanceSessionRole";
    let token = null;
    try {
      token = sessionStorage.getItem(AUTH_TOKEN_KEY);
      if (!token || sessionStorage.getItem(AUTH_ROLE_KEY) !== "teacher") location.replace("login.html");
    } catch (error) { console.error("Unable to read login session:", error); }

    const students = [];
    const statusOptions = ["มา", "สาย", "ลา", "ขาด"];
    const attendanceDate = document.getElementById("attendanceDate");
    const saveNote = document.getElementById("saveNote");
    let loadingStudents = true;
    let loadGeneration = 0;

    function localDateValue() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    async function callScript(parameters) {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams({ ...parameters, token }),
        redirect: "follow"
      });
      if (!response.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับ ${response.status}`);
      return response.json();
    }

    async function loadStudents() {
      const generation = ++loadGeneration;
      loadingStudents = true;
      students.splice(0);
      renderStudents();
      saveNote.textContent = "กำลังโหลดรายชื่อ…";
      try {
        const data = await callScript({ action: "teacher-attendance", date: attendanceDate.value });
        if (generation !== loadGeneration) return;
        if (data.code === "AUTH_REQUIRED") {
          sessionStorage.removeItem(AUTH_TOKEN_KEY);
          sessionStorage.removeItem(AUTH_ROLE_KEY);
          location.replace("login.html?expired=1");
          return;
        }
        if (!data.success) throw new Error(data.message || "โหลดรายชื่อไม่สำเร็จ");
        students.splice(0, students.length, ...data.students);
        document.getElementById("teacherRoom").textContent = `ม. ${data.room}`;
        document.getElementById("teacherName").textContent = data.teacher.name
          ? `ครู ${data.teacher.name}`
          : `เลขประจำตัว ${data.teacher.id}`;
        document.getElementById("notice").textContent = `กำลังดูรายชื่อห้อง ม. ${data.room} · ข้อมูลจากชีต ${data.room ? `ม.${data.room.replace(/\D/g, "")}` : ""}`;
        saveNote.textContent = "สถานะจะบันทึกลงชีต Attendance เมื่อเลือก";
        loadingStudents = false;
        renderStudents();
      } catch (error) {
        if (generation !== loadGeneration) return;
        console.error("Unable to load teacher attendance:", error);
        document.getElementById("notice").textContent = error.message || "โหลดรายชื่อนักเรียนไม่สำเร็จ";
        saveNote.textContent = "ตรวจสอบชีต Teacher, ชีตประจำห้อง และชีต Attendance ใน Google Sheet";
        loadingStudents = false;
        renderStudents();
      }
    }

    function renderStudents() {
      const body = document.getElementById("studentRows");
      body.replaceChildren();
      const totals = { present: 0, leave: 0, absent: 0, unchecked: 0 };
      for (const student of students) {
        const row = document.createElement("tr");
        for (const value of [student.number, student.id, student.name]) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.append(cell);
        }
        const statusCell = document.createElement("td");
        const picker = document.createElement("div");
        picker.className = "status-picker";
        picker.setAttribute("role", "group");
        picker.setAttribute("aria-label", `เลือกสถานะของ ${student.name}`);
        for (const status of statusOptions) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "status-option";
          button.dataset.status = status;
          button.textContent = status;
          button.setAttribute("aria-pressed", String(student.status === status));
          button.addEventListener("click", () => saveStudentStatus(student, status, picker));
          picker.append(button);
        }
        const statusLabel = document.createElement("span");
        statusLabel.className = "status-label";
        statusLabel.textContent = student.status ? `สถานะปัจจุบัน: ${student.status}` : "สถานะปัจจุบัน: ยังไม่เช็คชื่อ";
        statusCell.append(picker, statusLabel);
        row.append(statusCell);
        body.append(row);
        if (student.status === "มา" || student.status === "สาย") totals.present += 1;
        else if (student.status === "ลา") totals.leave += 1;
        else if (student.status === "ขาด") totals.absent += 1;
        else totals.unchecked += 1;
      }
      if (!students.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.textContent = loadingStudents ? "กำลังโหลดรายชื่อนักเรียน…" : "ไม่พบรายชื่อนักเรียนในห้องนี้";
        row.append(cell);
        body.append(row);
      }
      document.getElementById("studentCount").textContent = String(students.length);
      document.getElementById("presentCount").textContent = String(totals.present);
      document.getElementById("leaveCount").textContent = String(totals.leave);
      document.getElementById("absentCount").textContent = String(totals.absent);
      document.getElementById("uncheckedCount").textContent = String(totals.unchecked);
    }

    async function saveStudentStatus(student, selectedStatus, picker) {
      if (student.status === selectedStatus) return;
      const previousStatus = student.status;
      picker.querySelectorAll("button").forEach(button => { button.disabled = true; });
      saveNote.textContent = `กำลังบันทึกสถานะ ${student.name}…`;
      try {
        const data = await callScript({
          action: "set-status",
          date: attendanceDate.value,
          studentId: student.id,
          status: selectedStatus
        });
        if (data.code === "AUTH_REQUIRED") {
          sessionStorage.removeItem(AUTH_TOKEN_KEY);
          sessionStorage.removeItem(AUTH_ROLE_KEY);
          location.replace("login.html?expired=1");
          return;
        }
        if (!data.success) throw new Error(data.message || "บันทึกสถานะไม่สำเร็จ");
        student.status = selectedStatus;
        saveNote.textContent = `บันทึกสถานะ ${student.name} เป็น “${selectedStatus}” แล้ว`;
      } catch (error) {
        console.error("Unable to save student attendance:", error);
        student.status = previousStatus;
        saveNote.textContent = error.message || "บันทึกสถานะไม่สำเร็จ";
      }
      renderStudents();
    }

    attendanceDate.value = localDateValue();
    attendanceDate.addEventListener("change", loadStudents);
    loadStudents();
    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        sessionStorage.removeItem(AUTH_TOKEN_KEY);
        sessionStorage.removeItem(AUTH_ROLE_KEY);
        await fetch(SCRIPT_URL, { method: "POST", body: new URLSearchParams({ action: "logout", token }), redirect: "follow" });
      } catch (error) { console.error("Logout failed:", error); }
      finally { location.replace("login.html"); }
    });
  </script>
</body>
</html>
